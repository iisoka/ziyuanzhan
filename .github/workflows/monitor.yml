name: Monitor & Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitor.py'
      - 'requirements.txt'
      - 'docs/data/sources.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "monitor-deploy"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml pypinyin

      - name: Run monitor script
        run: |
          python monitor.py

      - name: Generate MoonTVPlus subscription
        run: |
          python -c "
          import json
          from urllib.parse import urlparse
          ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'
          def b58e(data):
              zeros = 0
              for b in data:
                  if b == 0: zeros += 1
                  else: break
              n = int.from_bytes(data, 'big')
              r = []
              while n > 0:
                  n, m = divmod(n, 58)
                  r.append(ALPHABET[m])
              r.extend(['1'] * zeros)
              return ''.join(reversed(r))
          with open('docs/data/online.json') as f:
              d = json.load(f)
          sites = {}
          for s in d['data']:
              api = s.get('api', '')
              if not api: continue
              dom = urlparse(api).netloc
              sites[dom] = {
                  'name': '🎬' + s['name'],
                  'api': 'https://liuiisok2.de5.net/?url=' + api,
                  'detail': s.get('link', '')
              }
          cfg = {'cache_time': 7200, 'api_site': sites}
          b58 = b58e(json.dumps(cfg, ensure_ascii=False).encode('utf-8'))
          with open('docs/data/moontv_sub.json', 'w', newline='') as f:
              f.write(b58)
          print(f'Generated {len(sites)} sites, b58 length: {len(b58)}')
          "

      - name: Clean old history files
        run: |
          cd docs/data
          ls -t monitor_*.json 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "📊 Update monitor data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
